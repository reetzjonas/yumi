{{- if .Values.postgresql.enabled }}
{{- $pg := .Values.postgresql -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yumi.postgresql.fullname" . }}
  labels:
    {{- include "yumi.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "yumi.postgresql.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "yumi.postgresql.fullname" . }}
  labels:
    {{- include "yumi.labels" . | nindent 4 }}
    {{- include "yumi.postgresql.selectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "yumi.postgresql.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "yumi.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yumi.postgresql.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The official Alpine PostgreSQL image uses UID/GID 70.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ printf "%s:%s" $pg.image.repository $pg.image.tag }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              value: {{ $pg.username | quote }}
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "yumi.postgresql.secretName" . }}
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}]
            periodSeconds: 10
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # PostgreSQL 18 keeps its data below /var/lib/postgresql/18/docker.
            - name: data
              mountPath: /var/lib/postgresql
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: socket
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
{{- end }}
