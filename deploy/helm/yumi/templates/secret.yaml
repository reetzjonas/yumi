{{- include "yumi.validate" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "yumi.fullname" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $authSecret := get $existing "BETTER_AUTH_SECRET" | default (randAlphaNum 48 | b64enc) -}}
{{- $pgPassword := get $existing "POSTGRES_PASSWORD" | default (randAlphaNum 32 | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "yumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  BETTER_AUTH_SECRET: {{ $authSecret }}
  {{- if .Values.postgresql.enabled }}
  {{- if not .Values.postgresql.auth.existingSecret }}
  POSTGRES_PASSWORD: {{ $pgPassword }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.username ($pgPassword | b64dec) (include "yumi.postgresql.fullname" .) .Values.postgresql.database | b64enc }}
  {{- end }}
  {{- else }}
  DATABASE_URL: {{ .Values.database.url | b64enc }}
  {{- end }}
{{- end }}
