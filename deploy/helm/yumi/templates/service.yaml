apiVersion: v1
kind: Service
metadata:
  name: {{ include "yumi.fullname" . }}
  labels:
    {{- include "yumi.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "yumi.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
