apiVersion: apps/v1
kind: Deployment
metadata:
  name: yumi
  labels:
    app.kubernetes.io/name: yumi
spec:
  replicas: 1
  # One migration runner at a time, including during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yumi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yumi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/reetzjonas/yumi:latest
          imagePullPolicy: Always
          command: ["bun", "packages/db/src/migrate.ts"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: yumi-env
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: app
          image: ghcr.io/reetzjonas/yumi:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: yumi-config
            - secretRef:
                name: yumi-env
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: yumi
spec:
  selector:
    app.kubernetes.io/name: yumi
  ports:
    - name: http
      port: 80
      targetPort: http
