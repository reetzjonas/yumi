# Relative keys in the Vault KV store configured by ClusterSecretStore/vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: yumi-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: yumi-env
  dataFrom:
    - extract:
        key: yumi-env
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: yumi-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: yumi-postgres
  dataFrom:
    - extract:
        key: yumi-postgres
