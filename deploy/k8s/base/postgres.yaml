apiVersion: v1
kind: Service
metadata:
  name: yumi-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: yumi-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yumi-postgres
spec:
  serviceName: yumi-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yumi-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yumi-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The official Alpine Postgres image uses UID/GID 70.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_USER
              value: yumi
            - name: POSTGRES_DB
              value: yumi
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yumi-postgres
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command:
                ["pg_isready", "-h", "127.0.0.1", "-U", "yumi", "-d", "yumi"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                ["pg_isready", "-h", "127.0.0.1", "-U", "yumi", "-d", "yumi"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                ["pg_isready", "-h", "127.0.0.1", "-U", "yumi", "-d", "yumi"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # PostgreSQL 18 stores data under /var/lib/postgresql/18/docker.
            - name: data
              mountPath: /var/lib/postgresql
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: socket
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
