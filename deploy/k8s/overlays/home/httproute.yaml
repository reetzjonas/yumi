# Same LAN/VPN gateway as rpg, without its public mail/VPS parent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yumi
spec:
  hostnames:
    - yumi.reetz.me
  parentRefs:
    - name: traefik-gateway
      namespace: homelab
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: yumi
          port: 80
