apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yumi
resources:
  - ../../base
  - httproute.yaml
  - config.yaml
patches:
  - path: keel.yaml
images:
  - name: ghcr.io/reetzjonas/yumi
    # Keel follows main's mutable tag. Use a SHA and remove Keel for a pinned release.
    newTag: latest
